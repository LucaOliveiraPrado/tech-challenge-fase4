[project]
name = "voc-rag"
version = "1.0.0"
description = "Voice of Customer Intelligence com RAG sobre as avaliações da Olist (Tech Challenge Fase 4)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "torch>=2.6",
    "sentence-transformers>=3.3",
    "chromadb>=1.0",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "google-genai>=1.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "streamlit>=1.40",
    "altair>=5.4",
    "typer>=0.12",
    "rich>=13.8",
    "tqdm>=4.66",
    "kagglehub>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "nbconvert>=7.16",
]

[project.scripts]
voc = "voc_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voc_rag"]

# torch com CUDA no Windows/Linux (GPU acelera embeddings e reranker);
# no macOS cai no índice padrão (CPU/MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
